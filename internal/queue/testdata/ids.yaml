# id shapes: `..` and `-x` are not ids; A3-machine beside a3-machine is a
# duplicate on a case-folding filesystem.
version: 1
defaults: {model: claude-opus-5-5, turns: 100, context: 130000, usd: 15, wall: 4h,
           merge: branch-only, device: never, verify: auto}
words: ""
rows:
  - id: ..
    packet: internal/packet/testdata/a3-machine.md
  - id: -x
    packet: internal/packet/testdata/a3-machine.md
  - id: a3-machine
    packet: internal/packet/testdata/a3-machine.md
  - id: A3-machine
    packet: internal/packet/testdata/a3-machine.md
