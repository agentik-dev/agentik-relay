\* The design of record (design/relay-r1.md §16): both guards on, lines that plan,
\* any live relay.pid holder refusing, the four properties under LoadFair. The
\* load is scaled to its three regions (under CloseAt, between, above OpenAt) and
\* the watchdog to stall-before-wall, shrunk from AR11 §3's 5/4/2 and 2/3 so TLC
\* runs under 120 s (§0).
CONSTANTS
    Rows = {r1, r2}
    MaxProcs = 5
    MaxLoad = 2
    OpenAt = 1
    CloseAt = 1
    MaxWait = 2
    StallAt = 1
    Wall = 2
    MaxDepth = 3
    Guard = TRUE
    RunGuard = TRUE
    LinesMayPlan = TRUE
    PidRule = "any"
    LockKind = "port"
SPECIFICATION LoadFair
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NoNestedMeasure
    OneMeasurePerRoot
    NoSpawnWhenOpen
    NoOrphanAfterExit
    UnrunNeverPasses
    NoSameAsMainAgainstLoaded
    LandedNeverMeasured
    BranchTipMovedBeforeLanded
    MergedShaIsGated
    NoMergeAfterMainMoved
    NoNestedSpawn
    OneHolder
    NoSpawnAfterAccountStop
PROPERTIES
    StalledChildEventuallyKilled
    OpenBreakerEventuallyCloses
    OpenBreakerEventuallyResolves
    EveryRunnableRowEventuallyGatedOrParked
